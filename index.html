<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metro Express - Coming Soon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/png" sizes="32x32" href="https://i.ibb.co/Kz6r6Fhv/IMG-0920.png">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            color: #fff;
            overflow: hidden;
            background: #0a1929;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .landing {
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #001a3d 0%, #003d7a 50%, #0066cc 100%);
            position: relative;
            overflow: hidden;
            padding: 2rem;
        }

        /* Motion Trails */
        .trail {
            position: absolute;
            height: 1px;
            background: #4FC3F7;
            box-shadow: 0 0 15px #4FC3F7, 0 0 25px rgba(79, 195, 247, 0.5);
            animation: trail 4s linear infinite;
            opacity: 0;
        }

        .trail:nth-child(1) { 
            top: 15%; 
            width: 300px; 
            animation-delay: 0s; 
        }
        .trail:nth-child(2) { 
            top: 30%; 
            width: 250px; 
            animation-delay: 0.8s; 
        }
        .trail:nth-child(3) { 
            top: 45%; 
            width: 350px; 
            animation-delay: 1.6s; 
        }
        .trail:nth-child(4) { 
            top: 60%; 
            width: 280px; 
            animation-delay: 2.4s; 
        }
        .trail:nth-child(5) { 
            top: 75%; 
            width: 320px; 
            animation-delay: 3.2s; 
        }
        .trail:nth-child(6) { 
            top: 20%; 
            width: 200px; 
            animation-delay: 1.2s; 
        }
        .trail:nth-child(7) { 
            top: 50%; 
            width: 270px; 
            animation-delay: 2s; 
        }
        .trail:nth-child(8) { 
            top: 85%; 
            width: 240px; 
            animation-delay: 2.8s; 
        }

        @keyframes trail {
            0% { 
                left: -400px; 
                opacity: 0; 
            }
            10% { 
                opacity: 0.7; 
            }
            50% { 
                opacity: 1; 
            }
            90% { 
                opacity: 0.7; 
            }
            100% { 
                left: 100%; 
                opacity: 0; 
            }
        }

        .content {
            text-align: center;
            z-index: 10;
            max-width: 800px;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            font-weight: 900;
            color: #4FC3F7;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 0 0 30px rgba(79, 195, 247, 0.8);
            margin-bottom: 3rem;
            animation: fadeInUp 1s ease-out;
        }

        h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 6rem;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 10px;
            animation: fadeInUp 1s ease-out 0.2s backwards, glow 2s ease-in-out infinite alternate;
            text-shadow: 
                0 0 10px rgba(79, 195, 247, 0.8),
                0 0 20px rgba(79, 195, 247, 0.6),
                0 0 40px rgba(79, 195, 247, 0.4),
                3px 3px 0px rgba(0, 0, 0, 0.3);
            line-height: 1;
        }

        @keyframes glow {
            from {
                text-shadow: 
                    0 0 10px rgba(79, 195, 247, 0.8),
                    0 0 20px rgba(79, 195, 247, 0.6),
                    0 0 40px rgba(79, 195, 247, 0.4),
                    3px 3px 0px rgba(0, 0, 0, 0.3);
            }
            to {
                text-shadow: 
                    0 0 20px rgba(79, 195, 247, 1),
                    0 0 30px rgba(79, 195, 247, 0.8),
                    0 0 50px rgba(79, 195, 247, 0.6),
                    3px 3px 0px rgba(0, 0, 0, 0.3);
            }
        }

        .subtitle {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            color: #4FC3F7;
            margin-bottom: 2rem;
            font-weight: 700;
            letter-spacing: 5px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(79, 195, 247, 0.6);
            animation: fadeInUp 1s ease-out 0.4s backwards;
        }

        p {
            font-size: 1.4rem;
            line-height: 1.8;
            margin-bottom: 3rem;
            color: #b3d9ff;
            animation: fadeInUp 1s ease-out 0.6s backwards;
            letter-spacing: 1px;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 2.5rem;
            animation: fadeInUp 1s ease-out 0.8s backwards;
        }

        .social-links a {
            color: #4FC3F7;
            font-size: 2.5rem;
            transition: all 0.3s;
            text-decoration: none;
        }

        .social-links a:hover {
            color: #fff;
            transform: translateY(-10px) scale(1.1);
            text-shadow: 0 0 30px rgba(79, 195, 247, 1);
        }

        .coming-soon-badge {
            display: inline-block;
            padding: 0.75rem 2rem;
            background: rgba(79, 195, 247, 0.1);
            border: 2px solid #4FC3F7;
            border-radius: 50px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 2rem;
            animation: fadeInUp 1s ease-out 1s backwards, pulse 2s ease-in-out infinite;
            box-shadow: 0 0 20px rgba(79, 195, 247, 0.3);
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 20px rgba(79, 195, 247, 0.3);
            }
            50% {
                box-shadow: 0 0 30px rgba(79, 195, 247, 0.6);
            }
        }

        @media (max-width: 768px) {
            .logo {
                font-size: 1.2rem;
                letter-spacing: 3px;
                margin-bottom: 2rem;
            }

            h1 {
                font-size: 3.5rem;
                letter-spacing: 5px;
            }

            .subtitle {
                font-size: 1.5rem;
                letter-spacing: 3px;
            }

            p {
                font-size: 1.1rem;
                padding: 0 1rem;
            }

            .social-links {
                gap: 2rem;
            }

            .social-links a {
                font-size: 2rem;
            }

            .coming-soon-badge {
                font-size: 0.9rem;
                padding: 0.6rem 1.5rem;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 2.5rem;
                letter-spacing: 3px;
            }

            .subtitle {
                font-size: 1.2rem;
            }

            p {
                font-size: 1rem;
            }
        }
    </style>
</head>
